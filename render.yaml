# Render Blueprint: một web service (Docker) + một PostgreSQL. Render tự gán DATABASE_URL.
services:
  - type: web
    name: aicomposer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aicomposer-db
          property: connectionString
      # Viết lời và hiểu lệnh bằng AI. sync: false: điền giá trị ở tab Environment trên Render, không để trong repo.
      # Để trống thì app vẫn chạy, chỉ ẩn phần AI.
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: aicomposer-db
    plan: free
    databaseName: aicomposer
    user: aicomposer
