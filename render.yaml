# Render Blueprint: một web service (Docker) + một PostgreSQL. Render tự gán DATABASE_URL.
services:
  - type: web
    name: aicomposer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aicomposer-db
          property: connectionString

databases:
  - name: aicomposer-db
    plan: free
    databaseName: aicomposer
    user: aicomposer
